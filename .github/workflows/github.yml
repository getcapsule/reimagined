name: Build, check and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (leave empty for checks only)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.tag != '') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  RUST_VERSION: "1.94.1"

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable action
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "capsule"))')
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Release tag must match Cargo.toml: expected v$version."
            exit 1
          fi
      - run: cargo fmt --all --check

  build:
    name: ${{ matrix.name }}
    needs: format
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev fonts-dejavu-core

      - name: Configure Windows C++ compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable action
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
          components: clippy

      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Check native build tools
        run: cmake --version

      - name: Clippy
        run: cargo clippy --locked --release --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Tests
        env:
          CAPSULE_DATA_DIR: ${{ runner.temp }}/capsule-ci
        run: cargo test --locked --release --target ${{ matrix.target }}

      - name: Build release executable
        run: cargo build --locked --release --bin capsule --target ${{ matrix.target }}

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, package | Out-Null
          Copy-Item -LiteralPath 'target/${{ matrix.target }}/release/capsule.exe' -Destination package
          Copy-Item -LiteralPath LICENSE -Destination package
          Compress-Archive -Path package/* -DestinationPath 'dist/capsule-${{ matrix.artifact }}.zip'

      - name: Package Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist package
          install -m 755 'target/${{ matrix.target }}/release/capsule' package/capsule
          install -m 644 LICENSE package/LICENSE
          tar -czf 'dist/capsule-${{ matrix.artifact }}.tar.gz' -C package capsule LICENSE

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capsule-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download platform builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: capsule-*
          merge-multiple: true
          path: dist

      - name: Publish platform builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          assets=(dist/capsule-windows-x86_64.zip dist/capsule-linux-x86_64.tar.gz)
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done

          state=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [[ "$state" == false ]]; then
            names=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            for asset in "${assets[@]}"; do
              if ! grep -Fxq "${asset##*/}" <<< "$names"; then
                echo "::error::The published release is missing ${asset##*/}."
                exit 1
              fi
            done
            echo "Release $RELEASE_TAG is already published with both platform builds."
            exit 0
          fi

          if [[ "$state" != true ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "capsule $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

          prerelease=false
          version_without_metadata="${RELEASE_TAG%%+*}"
          if [[ "$version_without_metadata" == *-* ]]; then
            prerelease=true
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"
