[package]
name = "capsule"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
yt-dlp = { version = "=1.4.6", default-features = false, features = ["rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "6", default-features = false, features = ["deflate"] }
tempfile = "3"
anyhow = "1"
fastrand = "2"
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png", "webp"] }
dirs = "6"
lofty = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt"] }
walkdir = "2"
cpal = "0.16"
iced = { git = "https://github.com/maxbergmark/iced", branch = "test/force_copy_src", features = ["wgpu", "tokio", "image", "svg"] }
iced_glass = { git = "https://github.com/maxbergmark/iced_glass", rev = "365840d547a7489d2ed03bf8cc1c53eea19b867c" }
rfd = "0.16"
ringbuf = "0.4.8"
rubato = { version = "0.16.2", default-features = false }
symphonia-adapter-libopus = "=0.2.0"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "mkv", "ogg", "pcm", "vorbis", "wav"] }
thiserror = "2"

[dev-dependencies]
log = "0.4"
iced_runtime = { git = "https://github.com/maxbergmark/iced", branch = "test/force_copy_src" }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell"] }
cpal = { version = "0.16", features = ["audio_thread_priority"] }

# Iced c038b58 with an alpha-capable DirectComposition surface on Windows.
[patch."https://github.com/maxbergmark/iced"]
iced_wgpu = { path = "vendor/iced_wgpu" }
